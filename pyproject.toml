[project]
name = "data-external-docs"
version = "0.1.0"
description = "Documentação automática de colunas do BigQuery a partir da doc externa da API de origem"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery==3.42.3",
    "anthropic==0.120.2",
    "httpx==0.28.1",
    "ruamel.yaml==0.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.uv]
package = false

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
